<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HTML Vault（HTML保管アプリ / LocalStorage）</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel (JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide (UMD) -->
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar{ display:none; }
    .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
    .line-clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    iframe { background: white; }
  </style>
</head>

<body class="bg-slate-50">
  <div id="root"></div>

  <!-- 画面真っ白対策：エラー可視化 -->
  <script>
    window.addEventListener("error", (e) => {
      const el = document.getElementById("root");
      if (!el) return;
      const msg = (e && (e.message || (e.error && e.error.message))) || "Unknown error";
      el.innerHTML = `
        <div style="padding:16px;font-family:system-ui;">
          <div style="font-weight:900;color:#b91c1c;">エラーで画面が描画できませんでした</div>
          <pre style="white-space:pre-wrap;background:#fff;border:1px solid #fee2e2;padding:12px;border-radius:12px;margin-top:8px;color:#7f1d1d;">${msg}</pre>
          <div style="margin-top:10px;color:#334155;font-size:12px;">
            CDNが学校回線でブロックされる場合があります（unpkg）。その場合はCDN差し替えで解決できます。
          </div>
        </div>`;
    });
  </script>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    // =========================
    // Storage Key
    // =========================
    const LS_KEY = "html_vault_local_v1";

    // =========================
    // Utils
    // =========================
    const nowISO = () => new Date().toISOString();
    const uid = (prefix="id") => `${prefix}_${Math.random().toString(36).slice(2,10)}${Date.now().toString(36).slice(2,7)}`;
    const safeLower = (s) => (s || "").toString().toLowerCase();
    const dedupe = (arr) => [...new Set((arr || []).filter(Boolean))];

    const normalizeTags = (raw) => {
      const arr = (raw || "")
        .split(/[,、\n]/)
        .map(s => s.trim())
        .filter(Boolean)
        .slice(0, 80);
      return dedupe(arr);
    };

    const tryCopy = async (text) => {
      try {
        await navigator.clipboard.writeText(text || "");
        return true;
      } catch {
        try {
          const ta = document.createElement("textarea");
          ta.value = text || "";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          return true;
        } catch {
          return false;
        }
      }
    };

    const downloadText = (filename, text, type="text/plain;charset=utf-8") => {
      const blob = new Blob([text], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    };

    const pickTitleFromUrl = (url) => {
      try {
        const u = new URL(url);
        const p = (u.pathname || "/").split("/").filter(Boolean).pop() || u.hostname;
        return decodeURIComponent(p).replace(/\.(html|htm)$/i, "") || u.hostname;
      } catch {
        return "URLメモ";
      }
    };

    const looksLikeHtml = (s) => /<html[\s>]|<!doctype html>/i.test(s || "");

    // =========================
    // Lucide Icon (UMD)
    // =========================
    const Ico = ({ name, size = 18, className = "" }) => {
      try {
        const icon = window.lucide?.icons?.[name];
        if (!icon || !icon.toSvg) return null;
        const svg = icon.toSvg({ width: size, height: size, class: className });
        return <span dangerouslySetInnerHTML={{ __html: svg }} />;
      } catch {
        return null;
      }
    };

    // =========================
    // Load / Save
    // =========================
    const loadState = () => {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch {
        return null;
      }
    };
    const saveState = (s) => localStorage.setItem(LS_KEY, JSON.stringify(s));

    const initialState = () => {
      const s = loadState();
      if (s) {
        if (!s.personal) s.personal = { folders: [], items: [], trash: [] };
        if (!s.shared) s.shared = { folders: [], items: [], trash: [] };
        if (!s.settings) s.settings = {};
        if (!Array.isArray(s.settings.pinnedTags)) s.settings.pinnedTags = ["校務","研修","連絡","掲示","ツール","Forms","FireStore"];
        if (typeof s.settings.previewAuto !== "boolean") s.settings.previewAuto = true;
        return s;
      }
      return {
        personal: { folders: [], items: [], trash: [] },
        shared: { folders: [], items: [], trash: [] },
        settings: { pinnedTags: ["校務","研修","連絡","掲示","ツール","Forms","FireStore"], previewAuto: true }
      };
    };

    // =========================
    // Modal
    // =========================
    const Modal = ({ open, onClose, title, icon, children, footer }) => {
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-[90]">
          <div className="absolute inset-0 bg-black/30" onClick={onClose}></div>
          <div className="absolute inset-x-0 top-6 mx-auto max-w-6xl px-4">
            <div className="bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden">
              <div className="p-5 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  {icon}
                  <div className="font-black text-slate-800">{title}</div>
                </div>
                <button onClick={onClose} className="p-2 rounded-xl hover:bg-slate-100" title="閉じる">
                  <Ico name="x" size={18} className="text-slate-600" />
                </button>
              </div>
              <div className="px-5 pb-5 space-y-4">
                {children}
                {footer ? <div className="pt-2">{footer}</div> : null}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // =========================
    // App
    // =========================
    function App() {
      const [state, setState] = useState(initialState);

      const [libraryMode, setLibraryMode] = useState("personal"); // personal/shared
      const lib = libraryMode === "personal" ? state.personal : state.shared;

      const [activeFolderId, setActiveFolderId] = useState("all");
      const [selectedItem, setSelectedItem] = useState(null);

      const [searchQuery, setSearchQuery] = useState("");
      const [starOnly, setStarOnly] = useState(false);
      const [tagFilter, setTagFilter] = useState("");
      const [showTrash, setShowTrash] = useState(false);

      const [tagsInput, setTagsInput] = useState("");
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [backupOpen, setBackupOpen] = useState(false);
      const [foldersOpen, setFoldersOpen] = useState(false);

      const [toastObj, setToastObj] = useState(null);
      const toastTimer = useRef(null);

      const previewRef = useRef(null);

      // persist
      useEffect(() => {
        const t = setTimeout(() => saveState(state), 200);
        return () => clearTimeout(t);
      }, [state]);

      // switch library
      useEffect(() => {
        setActiveFolderId("all");
        setSelectedItem(null);
        setTagsInput("");
        setTagFilter("");
        setShowTrash(false);
      }, [libraryMode]);

      const toast = (msg) => {
        if (toastTimer.current) clearTimeout(toastTimer.current);
        setToastObj({ msg });
        toastTimer.current = setTimeout(() => setToastObj(null), 2600);
      };

      const folders = lib.folders || [];
      const items = lib.items || [];
      const trash = lib.trash || [];
      const pinnedTags = state.settings?.pinnedTags || [];

      const listSource = showTrash ? trash : items;

      const filteredList = useMemo(() => {
        const q = safeLower(searchQuery.trim());
        const tf = safeLower(tagFilter.trim());

        return (listSource || []).filter(it => {
          if (!showTrash) {
            const folderOk = activeFolderId === "all" || it.folderId === activeFolderId;
            if (!folderOk) return false;
            if (starOnly && !it.starred) return false;

            if (tf) {
              const hasTag = (it.tags||[]).some(t => safeLower(t) === tf);
              if (!hasTag) return false;
            }
          }
          if (!q) return true;
          const title = safeLower(it.title);
          const url = safeLower(it.url || "");
          const tags = (it.tags||[]).map(safeLower).join(" ");
          const code = safeLower((it.code || "").slice(0, 2000)); // 軽量化
          return title.includes(q) || url.includes(q) || tags.includes(q) || code.includes(q);
        }).sort((a,b) => (b.updatedAt || b.createdAt || "").localeCompare(a.updatedAt || a.createdAt || ""));
      }, [listSource, activeFolderId, searchQuery, starOnly, tagFilter, showTrash]);

      // tag suggestions
      const tagStats = useMemo(() => {
        const map = new Map();
        items.forEach(it => (it.tags||[]).forEach(t => map.set(t, (map.get(t)||0)+1)));
        return Array.from(map.entries()).sort((a,b)=>b[1]-a[1]).map(([tag,count])=>({tag,count}));
      }, [items]);

      const tagSuggestions = useMemo(() => {
        const top = tagStats.slice(0, 18).map(x => x.tag);
        return dedupe([...pinnedTags, ...top]).slice(0, 30);
      }, [pinnedTags, tagStats]);

      const setLib = (nextLib) => {
        setState(prev => {
          const out = { ...prev };
          if (libraryMode === "personal") out.personal = nextLib;
          else out.shared = nextLib;
          return out;
        });
      };

      const createFolder = () => {
        const name = prompt("新しいフォルダ名を入力してください:");
        if (!name || !name.trim()) return;
        setLib({ ...lib, folders: [...folders, { id: uid("f"), name: name.trim(), createdAt: nowISO() }] });
        toast("フォルダ作成");
      };

      const renameFolder = (folderId) => {
        const f = folders.find(x => x.id === folderId);
        if (!f) return;
        const name = prompt("フォルダ名を変更:", f.name || "");
        if (!name || !name.trim()) return;
        setLib({ ...lib, folders: folders.map(x => x.id === folderId ? { ...x, name: name.trim() } : x) });
        toast("フォルダ名を変更");
      };

      const deleteFolder = (folderId) => {
        const f = folders.find(x => x.id === folderId);
        if (!f) return;
        if (!confirm(`フォルダ「${f.name}」を削除しますか？\n※中のデータは「フォルダなし」に移動します。`)) return;
        const nextFolders = folders.filter(x => x.id !== folderId);
        const nextItems = items.map(it => it.folderId === folderId ? { ...it, folderId: "" } : it);
        setLib({ ...lib, folders: nextFolders, items: nextItems });
        if (activeFolderId === folderId) setActiveFolderId("all");
        toast("フォルダ削除");
      };

      const openItem = (it) => {
        setSelectedItem(it);
        setTagsInput((it.tags||[]).join(", "));
        if (state.settings?.previewAuto) {
          setTimeout(() => refreshPreview(it), 50);
        }
      };

      const newItem = (type) => {
        const folderId = activeFolderId !== "all" ? activeFolderId : "";
        const it = {
          id: uid("h"),
          type, // "code" | "url"
          title: type === "url" ? "URLメモ" : "無題HTML",
          url: "",
          code: type === "code" ? "<!doctype html>\n<html lang='ja'>\n<head>\n<meta charset='utf-8'>\n<meta name='viewport' content='width=device-width,initial-scale=1'>\n<title>Untitled</title>\n</head>\n<body>\n\n</body>\n</html>\n" : "",
          notes: "",
          folderId,
          tags: [],
          starred: false,
          createdAt: nowISO(),
          updatedAt: nowISO()
        };
        setSelectedItem(it);
        setTagsInput("");
        setTimeout(() => refreshPreview(it), 50);
      };

      const toggleStar = (id) => {
        const next = items.map(it => it.id === id ? { ...it, starred: !it.starred, updatedAt: nowISO() } : it);
        setLib({ ...lib, items: next });
        if (selectedItem?.id === id) setSelectedItem(next.find(x => x.id === id));
      };

      const softDeleteItem = (id) => {
        const it = items.find(x => x.id === id);
        if (!it) return;
        const nextItems = items.filter(x => x.id !== id);
        const t = { ...it, deletedAt: nowISO() };
        setLib({ ...lib, items: nextItems, trash: [t, ...trash].slice(0, 5000) });
        if (selectedItem?.id === id) setSelectedItem(null);
        toast("ゴミ箱に移動しました");
      };

      const restoreFromTrash = (id) => {
        const it = trash.find(x => x.id === id);
        if (!it) return;
        const nextTrash = trash.filter(x => x.id !== id);
        const restored = { ...it };
        delete restored.deletedAt;
        restored.updatedAt = nowISO();
        setLib({ ...lib, items: [restored, ...items], trash: nextTrash });
        toast("復元しました");
      };

      const purgeFromTrash = (id) => {
        const it = trash.find(x => x.id === id);
        if (!it) return;
        if (!confirm("完全に削除しますか？（戻せません）")) return;
        setLib({ ...lib, trash: trash.filter(x => x.id !== id) });
        toast("完全削除しました");
      };

      const saveCurrent = () => {
        if (!selectedItem) return;
        const tags = normalizeTags(tagsInput);

        const payload = { ...selectedItem, tags, updatedAt: nowISO() };
        const exists = items.some(x => x.id === payload.id);

        const nextItems = exists
          ? items.map(x => x.id === payload.id ? payload : x)
          : [payload, ...items];

        setLib({ ...lib, items: nextItems });
        setSelectedItem(payload);
        toast("保存しました");
      };

      const addTagChip = (tag) => {
        const curr = normalizeTags(tagsInput);
        if (curr.includes(tag)) return;
        setTagsInput([...curr, tag].join(", "));
      };

      const removeTagChip = (tag) => {
        const curr = normalizeTags(tagsInput);
        setTagsInput(curr.filter(t => t !== tag).join(", "));
      };

      const refreshPreview = (it = selectedItem) => {
        if (!it) return;
        const iframe = previewRef.current;
        if (!iframe) return;
        if (it.type === "code") {
          const code = it.code || "";
          iframe.srcdoc = code;
        } else {
          // URLはX-Frame-Options等で埋め込み不可が多いので、埋め込みは試すが失敗しやすい
          iframe.removeAttribute("srcdoc");
          iframe.src = it.url || "about:blank";
        }
      };

      const exportHTML = () => {
        if (!selectedItem) return;
        if (selectedItem.type !== "code") { toast("コード保存の項目だけHTMLとして書き出しできます"); return; }
        const name = (selectedItem.title || "untitled").replace(/[\\\/:*?"<>|]/g, "_").slice(0, 40);
        downloadText(`${name}.html`, selectedItem.code || "", "text/html;charset=utf-8");
        toast("HTMLを書き出しました");
      };

      const exportAll = () => {
        downloadText(`HTMLVault_All_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(state, null, 2), "application/json;charset=utf-8");
      };

      const exportLibrary = () => {
        downloadText(`HTMLVault_${libraryMode}_Library_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(lib, null, 2), "application/json;charset=utf-8");
      };

      const importAll = async (file) => {
        if (!file) return;
        try {
          const txt = await file.text();
          const obj = JSON.parse(txt);
          if (!obj || typeof obj !== "object") throw new Error("bad");
          setState(obj);
          toast("全体JSONを読み込みました");
        } catch {
          alert("読み込みに失敗しました（JSON形式を確認）");
        }
      };

      const importLibraryOnly = async (file) => {
        if (!file) return;
        try {
          const txt = await file.text();
          const obj = JSON.parse(txt);
          if (!obj || typeof obj !== "object") throw new Error("bad");
          if (!obj.items || !obj.folders) throw new Error("not library");
          setLib({ folders: obj.folders || [], items: obj.items || [], trash: obj.trash || [] });
          toast("庫JSONを読み込み（置換）しました");
        } catch {
          alert("読み込みに失敗しました（庫JSON形式を確認）");
        }
      };

      const handleUploadHtml = async (file) => {
        if (!file) return;
        try {
          const txt = await file.text();
          const title = file.name.replace(/\.(html|htm)$/i, "");
          const folderId = activeFolderId !== "all" ? activeFolderId : "";
          const it = {
            id: uid("h"),
            type: "code",
            title: title || "アップロードHTML",
            url: "",
            code: looksLikeHtml(txt) ? txt : `<!doctype html>\n<html lang="ja">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>${title || "Untitled"}</title>\n</head>\n<body>\n<pre>${(txt||"").replace(/[<>&]/g, s => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[s]))}</pre>\n</body>\n</html>\n`,
            notes: "",
            folderId,
            tags: [],
            starred: false,
            createdAt: nowISO(),
            updatedAt: nowISO()
          };
          setSelectedItem(it);
          setTagsInput("");
          setTimeout(() => refreshPreview(it), 50);
          toast("HTMLを読み込みました（未保存）");
        } catch {
          alert("読み込みに失敗しました");
        }
      };

      const tryFetchAsHtmlAndConvert = async () => {
        if (!selectedItem || selectedItem.type !== "url") return;
        const url = (selectedItem.url || "").trim();
        if (!url) { toast("URLを入力してください"); return; }
        try {
          // CORSで失敗することが多いので「試す」機能として実装
          const res = await fetch(url, { method: "GET" });
          const text = await res.text();
          const folderId = selectedItem.folderId || (activeFolderId !== "all" ? activeFolderId : "");
          const converted = {
            ...selectedItem,
            type: "code",
            title: selectedItem.title || pickTitleFromUrl(url),
            code: text,
            folderId,
            updatedAt: nowISO()
          };
          setSelectedItem(converted);
          toast("取得できたので「コード保存」に変換しました（未保存）");
          setTimeout(() => refreshPreview(converted), 50);
        } catch {
          alert("取得に失敗しました。\n多くのサイトはCORSで取得できません。\n→「コードで保存（貼り付け）」で登録してください。");
        }
      };

      // keyboard shortcuts
      useEffect(() => {
        const handler = (e) => {
          const meta = e.metaKey || e.ctrlKey;
          if (meta && e.key.toLowerCase() === "s") {
            e.preventDefault();
            if (selectedItem) saveCurrent();
            else toast("保存対象がありません");
          }
          if (e.key === "Escape") {
            setSettingsOpen(false);
            setBackupOpen(false);
            setFoldersOpen(false);
          }
        };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [selectedItem, saveCurrent]);

      const currentFolders = useMemo(() => [{ id:"all", name:"すべて" }, ...folders], [folders]);

      const LibraryHeader = (
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-2">
            <div className="text-2xl font-black text-slate-900">HTML Vault</div>
            <div className="text-xs font-bold text-slate-500">HTML保管（URL/コード） / LocalStorage</div>
          </div>

          <div className="flex items-center gap-2 flex-wrap">
            <button
              onClick={() => setLibraryMode(libraryMode==="personal" ? "shared" : "personal")}
              className="px-3 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700 flex items-center gap-2"
              title="庫の切替（個人/共有）"
            >
              <Ico name="layers" size={16}/>
              {libraryMode==="personal" ? "個人庫" : "共有庫"}
            </button>

            <button
              onClick={() => setFoldersOpen(true)}
              className="px-3 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700 flex items-center gap-2"
            >
              <Ico name="folder" size={16}/> フォルダ
            </button>

            <button
              onClick={() => setBackupOpen(true)}
              className="px-3 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700 flex items-center gap-2"
            >
              <Ico name="database" size={16}/> JSON入出力
            </button>

            <button
              onClick={() => setSettingsOpen(true)}
              className="px-3 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700 flex items-center gap-2"
            >
              <Ico name="settings" size={16}/> 設定
            </button>
          </div>
        </div>
      );

      const SettingsModal = (
        <Modal
          open={settingsOpen}
          onClose={() => setSettingsOpen(false)}
          title="設定（タグ候補 / プレビュー自動更新）"
          icon={<Ico name="settings" size={20} className="text-indigo-600" />}
          footer={
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <button
                onClick={() => {
                  if (!confirm("全データを初期化しますか？（戻せません）")) return;
                  const fresh = initialState();
                  // initialState()はlocalStorageを読むので、完全初期化
                  localStorage.removeItem(LS_KEY);
                  setState({
                    personal: { folders: [], items: [], trash: [] },
                    shared: { folders: [], items: [], trash: [] },
                    settings: { pinnedTags: ["校務","研修","連絡","掲示","ツール","Forms","FireStore"], previewAuto: true }
                  });
                  setLibraryMode("personal");
                  setActiveFolderId("all");
                  setSelectedItem(null);
                  setTagsInput("");
                  setSearchQuery("");
                  setTagFilter("");
                  setStarOnly(false);
                  setShowTrash(false);
                  toast("初期化しました");
                }}
                className="px-4 py-2 rounded-2xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-sm font-bold text-rose-700"
              >
                全データ初期化
              </button>
              <button
                onClick={() => setSettingsOpen(false)}
                className="px-4 py-2 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold"
              >
                閉じる
              </button>
            </div>
          }
        >
          <div className="space-y-3">
            <div className="text-xs font-bold text-slate-400 uppercase tracking-widest">タグ候補（固定）</div>
            <input
              className="w-full p-3 rounded-2xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-200"
              value={(state.settings?.pinnedTags || []).join(", ")}
              onChange={(e) => {
                const tags = normalizeTags(e.target.value);
                setState(prev => ({ ...prev, settings: { ...(prev.settings||{}), pinnedTags: tags } }));
              }}
            />

            <div className="flex items-center justify-between gap-2">
              <div className="text-sm font-bold text-slate-700">選択時にプレビューを自動更新</div>
              <button
                onClick={() => setState(prev => ({ ...prev, settings: { ...(prev.settings||{}), previewAuto: !prev.settings.previewAuto } }))}
                className={`px-3 py-2 rounded-xl text-xs font-bold border ${state.settings?.previewAuto ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-white border-slate-200 text-slate-700 hover:bg-slate-50"}`}
              >
                {state.settings?.previewAuto ? "ON" : "OFF"}
              </button>
            </div>

            <div className="md:col-span-2 bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs text-slate-600 leading-relaxed">
              <div className="font-bold text-slate-700 mb-1">ショートカット</div>
              <div>・Ctrl/Cmd + S：保存</div>
              <div>・Esc：モーダルを閉じる</div>
            </div>
          </div>
        </Modal>
      );

      const BackupModal = (
        <Modal
          open={backupOpen}
          onClose={() => setBackupOpen(false)}
          title="JSON入出力（バックアップ / 復元）"
          icon={<Ico name="database" size={20} className="text-indigo-600" />}
          footer={
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <button
                onClick={exportAll}
                className="px-4 py-2 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold"
              >
                全体を書き出し
              </button>

              <button
                onClick={exportLibrary}
                className="px-4 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700"
              >
                今の庫を書き出し（{libraryMode==="personal"?"個人":"共有"}）
              </button>

              <label className="px-4 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700 cursor-pointer">
                全体JSONを読み込む（置換）
                <input type="file" accept="application/json" className="hidden"
                  onChange={(e) => importAll(e.target.files?.[0])}
                />
              </label>

              <label className="px-4 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700 cursor-pointer">
                今の庫に庫JSONを読み込む（置換）
                <input type="file" accept="application/json" className="hidden"
                  onChange={(e) => importLibraryOnly(e.target.files?.[0])}
                />
              </label>
            </div>
          }
        >
          <div className="bg-amber-50 border border-amber-100 rounded-2xl p-4 text-sm text-amber-900">
            <div className="font-bold">共有（クラウド無し運用）</div>
            <div className="text-xs text-amber-800 mt-1 leading-relaxed">
              共有は「共有庫に保存 → 共有庫JSONを書き出し → 配布 → 各端末で読み込み」で実現できます。
            </div>
          </div>
        </Modal>
      );

      const FoldersModal = (
        <Modal
          open={foldersOpen}
          onClose={() => setFoldersOpen(false)}
          title="フォルダ管理"
          icon={<Ico name="folder" size={20} className="text-indigo-600" />}
          footer={
            <div className="flex items-center justify-between gap-2">
              <button
                onClick={createFolder}
                className="px-4 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700 flex items-center gap-2"
              >
                <Ico name="plus" size={16} /> 新規フォルダ
              </button>
              <button
                onClick={() => setFoldersOpen(false)}
                className="px-4 py-2 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold"
              >
                閉じる
              </button>
            </div>
          }
        >
          <div className="space-y-2 max-h-[60vh] overflow-y-auto no-scrollbar pr-1">
            {folders.length === 0 && (
              <div className="text-sm text-slate-500">フォルダはまだありません。</div>
            )}
            {folders.map(f => (
              <div key={f.id} className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center justify-between gap-2">
                <div className="font-bold text-slate-800">{f.name}</div>
                <div className="flex items-center gap-1">
                  <button onClick={() => renameFolder(f.id)} className="p-2 rounded-xl hover:bg-slate-100" title="名前変更">
                    <Ico name="pencil" size={16} className="text-slate-600" />
                  </button>
                  <button onClick={() => deleteFolder(f.id)} className="p-2 rounded-xl hover:bg-rose-50" title="削除">
                    <Ico name="trash-2" size={16} className="text-rose-600" />
                  </button>
                </div>
              </div>
            ))}
          </div>
        </Modal>
      );

      const leftList = (
        <div className="bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden">
          <div className="p-4 border-b border-slate-200">
            <div className="flex items-center justify-between gap-2">
              <div className="font-black text-slate-800">ライブラリ</div>
              <div className="flex items-center gap-1">
                <button
                  onClick={() => setShowTrash(!showTrash)}
                  className={`px-3 py-2 rounded-2xl text-xs font-bold border ${showTrash ? "bg-rose-50 border-rose-200 text-rose-800" : "bg-white border-slate-200 text-slate-700 hover:bg-slate-50"}`}
                  title="ゴミ箱"
                >
                  <Ico name="trash-2" size={14}/> {showTrash ? "ゴミ箱" : "通常"}
                </button>
              </div>
            </div>

            <div className="mt-3 grid grid-cols-2 gap-2">
              <button
                onClick={() => newItem("code")}
                className="px-3 py-2 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold flex items-center justify-center gap-2"
              >
                <Ico name="file-plus" size={16} /> 新規（コード）
              </button>

              <button
                onClick={() => newItem("url")}
                className="px-3 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700 flex items-center justify-center gap-2"
              >
                <Ico name="link" size={16} /> 新規（URL）
              </button>
            </div>

            <label className="mt-2 block">
              <div className="px-3 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700 flex items-center justify-center gap-2 cursor-pointer">
                <Ico name="upload" size={16} /> HTMLをアップロード
              </div>
              <input
                type="file"
                accept=".html,.htm,text/html"
                className="hidden"
                onChange={(e) => handleUploadHtml(e.target.files?.[0])}
              />
            </label>

            <div className="mt-3">
              <input
                className="w-full p-3 rounded-2xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-200"
                placeholder="検索（タイトル/URL/タグ/コード一部）"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
              />
            </div>

            {!showTrash && (
              <>
                <div className="mt-3 grid grid-cols-2 gap-2">
                  <select
                    className="w-full p-3 rounded-2xl border border-slate-200 bg-white outline-none"
                    value={activeFolderId}
                    onChange={(e)=> setActiveFolderId(e.target.value)}
                  >
                    {currentFolders.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                  </select>
                  <button
                    onClick={() => setStarOnly(!starOnly)}
                    className={`px-3 py-2 rounded-2xl text-sm font-bold border ${starOnly ? "bg-amber-50 border-amber-200 text-amber-900" : "bg-white border-slate-200 text-slate-700 hover:bg-slate-50"}`}
                    title="スターだけ"
                  >
                    <Ico name="star" size={16}/> {starOnly ? "スターON" : "スター"}
                  </button>
                </div>

                <div className="mt-3">
                  <div className="flex items-center gap-2">
                    <input
                      className="flex-1 p-3 rounded-2xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-200"
                      placeholder="タグで絞り込み（完全一致）"
                      value={tagFilter}
                      onChange={(e)=> setTagFilter(e.target.value)}
                    />
                    <button
                      onClick={() => setTagFilter("")}
                      className="px-3 py-3 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50"
                      title="解除"
                    >
                      <Ico name="x" size={16}/>
                    </button>
                  </div>

                  <div className="mt-2 flex flex-wrap gap-2">
                    {tagSuggestions.slice(0, 12).map(tag => (
                      <button
                        key={tag}
                        onClick={() => setTagFilter(tag)}
                        className="px-3 py-1.5 rounded-full border border-slate-200 bg-white hover:bg-slate-50 text-xs font-bold text-slate-700"
                      >
                        #{tag}
                      </button>
                    ))}
                  </div>
                </div>
              </>
            )}
          </div>

          <div className="max-h-[62vh] overflow-y-auto no-scrollbar">
            {filteredList.length === 0 && (
              <div className="p-4 text-sm text-slate-500">表示するデータがありません。</div>
            )}

            {filteredList.map(it => (
              <div
                key={it.id}
                className={`p-4 border-b border-slate-100 hover:bg-slate-50 cursor-pointer ${selectedItem?.id === it.id ? "bg-indigo-50" : ""}`}
                onClick={() => openItem(it)}
              >
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <div className="font-bold text-slate-800 truncate flex items-center gap-2">
                      {it.type === "code" ? <Ico name="file-code" size={16} className="text-indigo-600"/> : <Ico name="link" size={16} className="text-slate-600"/>}
                      <span className="truncate">{it.title || (it.type==="url" ? "URLメモ" : "無題HTML")}</span>
                    </div>
                    <div className="text-xs text-slate-500 mt-1 line-clamp-2">
                      {it.type === "url" ? (it.url || "（URL未設定）") : ((it.code || "").slice(0, 120) || "（HTML未入力）")}
                    </div>
                    <div className="text-[11px] text-slate-400 mt-2 flex items-center gap-2 flex-wrap">
                      <span>{(it.updatedAt || it.createdAt || "").slice(0,10)}</span>
                      {(it.tags||[]).slice(0,3).map(t => (
                        <span key={t} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">#{t}</span>
                      ))}
                    </div>
                  </div>

                  {!showTrash ? (
                    <div className="flex items-center gap-1">
                      <button onClick={(e)=>{ e.stopPropagation(); toggleStar(it.id); }} className="p-2 rounded-xl hover:bg-white" title="スター">
                        <Ico name="star" size={16} className={it.starred ? "text-amber-500" : "text-slate-400"} />
                      </button>
                      <button onClick={(e)=>{ e.stopPropagation(); softDeleteItem(it.id); }} className="p-2 rounded-xl hover:bg-rose-50" title="ゴミ箱へ">
                        <Ico name="trash-2" size={16} className="text-rose-600" />
                      </button>
                    </div>
                  ) : (
                    <div className="flex items-center gap-1">
                      <button onClick={(e)=>{ e.stopPropagation(); restoreFromTrash(it.id); }} className="p-2 rounded-xl hover:bg-emerald-50" title="復元">
                        <Ico name="rotate-ccw" size={16} className="text-emerald-700" />
                      </button>
                      <button onClick={(e)=>{ e.stopPropagation(); purgeFromTrash(it.id); }} className="p-2 rounded-xl hover:bg-rose-50" title="完全削除">
                        <Ico name="x-circle" size={16} className="text-rose-700" />
                      </button>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      );

      const rightEditor = (
        <div className="bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden">
          <div className="p-4 border-b border-slate-200 flex items-center justify-between gap-2 flex-wrap">
            <div className="flex items-center gap-2">
              <div className="font-black text-slate-800">編集 / プレビュー</div>
              <div className="text-xs text-slate-500">Ctrl/Cmd+Sで保存</div>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={() => selectedItem && refreshPreview()}
                className="px-3 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700 flex items-center gap-2"
                title="プレビュー更新"
              >
                <Ico name="refresh-cw" size={16}/> 更新
              </button>

              <button
                onClick={() => selectedItem && saveCurrent()}
                className="px-3 py-2 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold flex items-center gap-2"
              >
                <Ico name="save" size={16}/> 保存
              </button>
            </div>
          </div>

          {!selectedItem ? (
            <div className="p-6 text-slate-500">
              左から項目を選ぶか、「新規（コード）」「新規（URL）」で作成してください。
            </div>
          ) : (
            <div className="p-4 space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div className="space-y-1">
                  <div className="text-xs font-bold text-slate-400 uppercase tracking-widest">タイトル</div>
                  <input
                    className="w-full p-3 rounded-2xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-200"
                    value={selectedItem.title || ""}
                    onChange={(e)=> setSelectedItem(prev => ({ ...prev, title: e.target.value }))}
                  />
                </div>

                <div className="space-y-1">
                  <div className="text-xs font-bold text-slate-400 uppercase tracking-widest">フォルダ</div>
                  <select
                    className="w-full p-3 rounded-2xl border border-slate-200 bg-white outline-none"
                    value={selectedItem.folderId || ""}
                    onChange={(e)=> setSelectedItem(prev => ({ ...prev, folderId: e.target.value }))}
                    disabled={showTrash}
                  >
                    <option value="">（フォルダなし）</option>
                    {folders.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                  </select>
                </div>
              </div>

              <div className="space-y-1">
                <div className="text-xs font-bold text-slate-400 uppercase tracking-widest">タグ（カンマ区切り）</div>
                <input
                  className="w-full p-3 rounded-2xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-200"
                  value={tagsInput}
                  onChange={(e)=> setTagsInput(e.target.value)}
                />
                <div className="mt-2 flex flex-wrap gap-2">
                  {tagSuggestions.slice(0, 16).map(tag => {
                    const curr = normalizeTags(tagsInput);
                    const on = curr.includes(tag);
                    return (
                      <button
                        key={tag}
                        onClick={() => on ? removeTagChip(tag) : addTagChip(tag)}
                        className={`px-3 py-1.5 rounded-full border text-xs font-bold ${on ? "bg-indigo-600 border-indigo-600 text-white" : "bg-white border-slate-200 text-slate-700 hover:bg-slate-50"}`}
                      >
                        #{tag}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
                <div className="space-y-2">
                  <div className="flex items-center justify-between gap-2 flex-wrap">
                    <div className="font-bold text-slate-800">
                      {selectedItem.type === "code" ? "HTMLコードで保存" : "URLで保存（参照）"}
                    </div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <button
                        onClick={async () => {
                          if (selectedItem.type === "code") {
                            const ok = await tryCopy(selectedItem.code || "");
                            toast(ok ? "コードをコピーしました" : "コピー失敗");
                          } else {
                            const ok = await tryCopy(selectedItem.url || "");
                            toast(ok ? "URLをコピーしました" : "コピー失敗");
                          }
                        }}
                        className="px-3 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700 flex items-center gap-2"
                      >
                        <Ico name="copy" size={16}/> コピー
                      </button>

                      {selectedItem.type === "code" ? (
                        <button
                          onClick={exportHTML}
                          className="px-3 py-2 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold flex items-center gap-2"
                        >
                          <Ico name="download" size={16}/> HTML書き出し
                        </button>
                      ) : (
                        <>
                          <button
                            onClick={() => {
                              const url = (selectedItem.url || "").trim();
                              if (!url) return toast("URL未入力です");
                              window.open(url, "_blank", "noopener,noreferrer");
                            }}
                            className="px-3 py-2 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold flex items-center gap-2"
                          >
                            <Ico name="external-link" size={16}/> 開く
                          </button>

                          <button
                            onClick={tryFetchAsHtmlAndConvert}
                            className="px-3 py-2 rounded-2xl border border-amber-200 bg-amber-50 hover:bg-amber-100 text-sm font-bold text-amber-900 flex items-center gap-2"
                            title="CORSで失敗することが多いです"
                          >
                            <Ico name="file-down" size={16}/> 取得→コード化（試す）
                          </button>
                        </>
                      )}
                    </div>
                  </div>

                  {selectedItem.type === "url" ? (
                    <div className="space-y-2">
                      <div className="text-xs text-slate-500">
                        ※ 多くのサイトは埋め込み/取得が制限されます。確実なのは「コードで保存（貼り付け）」です。
                      </div>
                      <input
                        className="w-full p-3 rounded-2xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-200"
                        placeholder="https://..."
                        value={selectedItem.url || ""}
                        onChange={(e)=> {
                          const url = e.target.value;
                          setSelectedItem(prev => {
                            const next = { ...prev, url };
                            if (!next.title || next.title === "URLメモ") next.title = pickTitleFromUrl(url);
                            return next;
                          });
                        }}
                      />
                      <div className="space-y-1">
                        <div className="text-xs font-bold text-slate-400 uppercase tracking-widest">メモ（任意）</div>
                        <textarea
                          className="w-full p-3 rounded-2xl border border-slate-200 bg-white text-sm outline-none resize-none"
                          rows="4"
                          value={selectedItem.notes || ""}
                          onChange={(e)=> setSelectedItem(prev => ({ ...prev, notes: e.target.value }))}
                          placeholder="このURLの用途、更新ポイント、注意点など"
                        />
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-2">
                      <textarea
                        className="w-full p-3 rounded-2xl border border-slate-200 bg-white text-sm font-mono outline-none resize-none"
                        rows="14"
                        value={selectedItem.code || ""}
                        onChange={(e)=> setSelectedItem(prev => ({ ...prev, code: e.target.value }))}
                        placeholder="HTMLコードを貼り付け"
                      />
                      <div className="flex items-center justify-between gap-2 flex-wrap">
                        <div className="text-xs text-slate-500">srcdocでプレビューします（安全のため外部リソースは読み込まれない場合があります）。</div>
                        <button
                          onClick={() => refreshPreview()}
                          className="px-3 py-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-bold text-slate-700 flex items-center gap-2"
                        >
                          <Ico name="play" size={16}/> プレビュー
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                <div className="space-y-2">
                  <div className="flex items-center justify-between gap-2">
                    <div className="font-bold text-slate-800">プレビュー</div>
                    <div className="text-xs text-slate-500">
                      {selectedItem.type === "url" ? "URL埋め込みは制限されることがあります" : "srcdocプレビュー"}
                    </div>
                  </div>
                  <div className="border border-slate-200 rounded-2xl overflow-hidden bg-white">
                    <iframe
                      ref={previewRef}
                      title="preview"
                      className="w-full h-[460px]"
                      sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads"
                      src="about:blank"
                    ></iframe>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );

      return (
        <div className="max-w-7xl mx-auto px-4 py-6 space-y-4">
          {LibraryHeader}

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            {leftList}
            {rightEditor}
          </div>

          {SettingsModal}
          {BackupModal}
          {FoldersModal}

          {toastObj && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[120]">
              <div className="bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl text-sm font-bold flex items-center gap-2">
                <Ico name="check" size={16} className="text-emerald-300" />
                {toastObj.msg}
              </div>
            </div>
          )}

          <div className="text-[11px] text-slate-400 text-center pt-2">
            ©2026 Takayuki WAYAMA（LocalStorage / No Cloud）
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    try { window.lucide && window.lucide.createIcons && window.lucide.createIcons(); } catch {}
  </script>
</body>
</html>
